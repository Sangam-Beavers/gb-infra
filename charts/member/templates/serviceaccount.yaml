{{- if eq .Values.secretBackend "aws" }}
# member Pod 런타임 ServiceAccount — EKS Pod Identity로 Cognito 관리 역할 연결.
# Terraform module.cognito(aws_eks_pod_identity_association.member)이 이 SA(이름 일치)에 역할을 바인딩한다.
# IRSA와 달리 roleArn 어노테이션이 필요 없다 — eks-pod-identity-agent가 컨테이너 자격증명을 주입하므로
# 앱의 DefaultCredentialsProvider(ContainerCredentialsProvider)가 sts 의존성 없이 픽업한다.
# (dev=vault는 secretBackend!=aws라 렌더 안 됨 → default SA 사용.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member
  namespace: {{ .Values.namespace }}
{{- end }}
