{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: member-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: member-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/member/db) ─────────────────────
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
    # ── AWS Secrets Manager: Redis (sb/stage/redis/auth) ─────────────────
    - secretKey: REDIS_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: primary_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: port
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: auth_token
    # ElastiCache 전송중 암호화 여부(tls:true) → Spring redis ssl.enabled로 주입 (평문 접속 시 핸드셰이크 행 방지)
    - secretKey: SPRING_DATA_REDIS_SSL_ENABLED
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: tls
    # ── AWS Parameter Store: Cognito + 앱 시크릿 (/sb/stage/member/*) ────
    - secretKey: AUTH_ISSUER_URI
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psPrefix }}/AUTH_ISSUER_URI
    - secretKey: COGNITO_REGION
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psPrefix }}/COGNITO_REGION
    - secretKey: COGNITO_USER_POOL_ID
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psPrefix }}/COGNITO_USER_POOL_ID
    - secretKey: GB_CRYPTO_KEY
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psPrefix }}/GB_CRYPTO_KEY
    - secretKey: SPRING_MAIL_PASSWORD
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psPrefix }}/SPRING_MAIL_PASSWORD
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psKafkaBootstrapServers }}
{{- end }}
