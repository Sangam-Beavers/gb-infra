image:
  repository: harbor.sb.fisa/global_bridge/exchange-updater
  tag: "1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-dockercfg

# UTC 기준. 0 15 * * * = UTC 15:00 = KST 00:00 (자정)
# 외부 환율 API(open.er-api.com)가 UTC 자정 전후 갱신하므로 충분한 여유를 두고 KST 자정에 실행.
schedule: "0 15 * * *"

successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

# 완료(성공/실패)된 Job 과 그 Pod 를 종료 후 N초 뒤 자동 삭제 → 완료된 Pod 가 남지 않게 정리.
# 600 = 10분 (로그 확인 여유 후 자동 삭제). 실패 Pod 도 함께 삭제되므로 더 오래 보려면 값을 키운다.
ttlSecondsAfterFinished: 600

# 비밀 백엔드 — dev=vault, stage=aws (values-stage.yaml에서 override)
secretBackend: vault

namespace: sb-dev-app-ns

externalSecret:
  refreshInterval: 1h
  smRedisPath: sb/stage/redis/auth

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 200m
