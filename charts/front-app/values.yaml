image:
  repository: harbor.sb.fisa/global_bridge/front-app
  tag: "10"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-dockercfg

replicaCount: 1

containerPort: 80

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: cilium
  host: app.dev.fisa
  annotations:
    cert-manager.io/cluster-issuer: "sb-local-ca-issuer"
  tls:
    enabled: true
    secretName: front-app-tls

# 컨테이너에 주입될 환경변수 (docker-entrypoint.sh가 sed 치환에 사용)
env:
  SKIP_AUTH: "false"
  OIDC_CLIENT_ID: "gzoLbbd9iqqlGEPjdQAUjB9OjWL0wklVNC0u7EFm"
  OIDC_AUTHORIZE_ENDPOINT: "https://sso.sb.fisa/application/o/authorize/"
  OIDC_TOKEN_ENDPOINT: "https://sso.sb.fisa/application/o/token/"
  OIDC_REDIRECT_URI: "https://app.dev.fisa/auth/callback"
  OIDC_END_SESSION_ENDPOINT: "https://sso.sb.fisa/application/o/gb-backend/end-session/"
  OIDC_POST_LOGOUT_REDIRECT_URI: "https://app.dev.fisa/login"

resources:
  # 정적/nginx 서비스 — 경량, 메모리 request=limit(Guaranteed)
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 128Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # ScheduleAnyway: 노드가 부족해도 Pending 없이 best-effort 분산 (HPA/오토스케일 환경 권장)
  # DoNotSchedule: 균등 분산을 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설을 유도
  whenUnsatisfiable: ScheduleAnyway
