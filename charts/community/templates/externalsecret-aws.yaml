{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: community-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: community-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/community/db) ──────────────────
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
    # ── AWS Secrets Manager: Redis (sb/stage/redis/auth) — member와 공용 ──
    - secretKey: REDIS_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: primary_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: port
    - secretKey: SPRING_DATA_REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: auth_token
    - secretKey: SPRING_DATA_REDIS_SSL_ENABLED
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: tls
    # ── AWS Parameter Store: Auth + 암호화 키 (member 경로 공용) ──────────
    - secretKey: AUTH_ISSUER_URI
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psAuthIssuerUri }}  # /sb/stage/member/AUTH_ISSUER_URI 공용
    - secretKey: GB_CRYPTO_KEY
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psCryptoKey }}      # /sb/stage/member/GB_CRYPTO_KEY 공용
    # ── AWS Parameter Store: Kafka (공용 경로) ────────────────────────────
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psKafkaBootstrapServers }}
{{- end }}