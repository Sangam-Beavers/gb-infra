apiVersion: v1
kind: ConfigMap
metadata:
  name: community-config
data:
  # JWT 검증용 OIDC issuer (Authentik/Cognito)
  AUTH_ISSUER_URI: {{ .Values.config.authIssuerUri | quote }}
  # community → member-service 호출 base URL
  MEMBER_API_BASE_URL: {{ .Values.config.memberApiBaseUrl | quote }}
  # Aurora MySQL JDBC URL
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .Values.config.dbHost }}:{{ .Values.config.dbPort }}/{{ .Values.config.dbName }}?serverTimezone=UTC&characterEncoding=UTF-8"
  # Kafka 브로커
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrapServers | quote }}
