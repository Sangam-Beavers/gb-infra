apiVersion: v1
kind: ConfigMap
metadata:
  name: community-config
data:
  {{- if eq .Values.secretBackend "vault" }}
  # dev 전용: Authentik issuer URI, DB URL, Redis host, Kafka
  # (MEMBER_API_BASE_URL은 공통 — vault 블록 밖에서 주입)
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: {{ .Values.config.authIssuerUri | quote }}
  SPRING_DATASOURCE_URL: "jdbc:mysql://{{ .Values.config.dbHost }}:{{ .Values.config.dbPort }}/{{ .Values.config.dbName }}?serverTimezone=UTC&characterEncoding=UTF-8"
  SPRING_DATA_REDIS_HOST: {{ .Values.config.redisHost | quote }}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.config.kafkaBootstrapServers | quote }}
  {{- end }}
  # stage(aws): 위 값들은 ExternalSecret(SM/PS) + application-stage.yml 이 처리
  # REDIS_HOST/PORT/PASSWORD, AUTH_ISSUER_URI, KAFKA_BOOTSTRAP_SERVERS → ExternalSecret
  # MEMBER_API_BASE_URL → 아래 ConfigMap

  SPRING_JPA_HIBERNATE_DDL_AUTO: {{ .Values.config.ddlAuto | quote }}
  MEMBER_API_BASE_URL: {{ .Values.config.memberApiBaseUrl | quote }}
  TRANSLATION_AWS_REGION: {{ .Values.config.translationAwsRegion | quote }}
  # 번역 클라이언트 — 전 환경(dev/stage/prod) 무조건 실제 Bedrock 호출.
  # (로컬 노트북 직접 실행은 이 ConfigMap을 안 쓰므로 application-dev.yml 기본값 mock 유지 — 클러스터 배포만 bedrock.)
  # 클러스터 파드는 Pod Identity/IRSA 자격으로 Lambda를 호출하므로 자격 조회 OK.
  TRANSLATION_CLIENT: "bedrock"