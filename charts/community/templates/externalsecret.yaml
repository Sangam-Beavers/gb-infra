apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: community-secrets
  labels:
    app: community
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: community-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: community-service/dev
        property: db_username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: community-service/dev
        property: db_password
    - secretKey: GB_CRYPTO_KEY
      remoteRef:
        key: community-service/dev
        property: gb_crypto_key
