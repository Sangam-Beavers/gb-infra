env: stage
namespace: sb-stage-app-ns
secretBackend: aws
springProfilesActive: stage

image:
  repository: harbor.sb.fisa/global_bridge/community
  tag: "10"
  pullPolicy: IfNotPresent

replicaCount: 2

imagePullSecrets:
  - name: harbor-dockercfg

service:
  type: ClusterIP
  port: 8080
  containerPort: 8082

config:
  ddlAuto: "update"
  memberApiBaseUrl: "http://member.sb-stage-app-ns.svc.cluster.local:8081"
  translationAwsRegion: "ap-northeast-2"
  # redisHost 없음 — REDIS_HOST/PORT는 SM ExternalSecret(sb/stage/redis/auth)이 주입

externalSecret:
  refreshInterval: 1h
  smDbPath: sb/stage/community/db
  smRedisPath: sb/stage/redis/auth
  psAuthIssuerUri: /sb/stage/member/AUTH_ISSUER_URI      # member와 동일 값 — 공용
  psCryptoKey: /sb/stage/member/GB_CRYPTO_KEY            # member와 동일 값 — 공용
  psKafkaBootstrapServers: /sb/stage/kafka/bootstrap_servers
  psTranslationLambdaUrl: /sb/stage/community/TRANSLATION_LAMBDA_URL