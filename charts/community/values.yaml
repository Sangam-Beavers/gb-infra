# 컨테이너 이미지
image:
  repository: harbor.sb.fisa/global_bridge/community
  tag: "18"
  pullPolicy: IfNotPresent

# Pod 개수
replicaCount: 1

# Harbor 사설 레지스트리 인증 (시크릿은 community-dev NS에 별도 만듦)
imagePullSecrets:
  - name: harbor-dockercfg

# Spring server.port = 8082
service:
  port: 8080          # 기존 8082 → 8080 (nginx.conf 접근 포트)
  containerPort: 8082  # 추가 (실제 앱 포트)
  type: ClusterIP

# 어느 환경에서 도는지 (Dockerfile 기본값 dev를 K8s에서도 dev로)
springProfilesActive: dev

# 평범한 설정값 (ConfigMap으로 주입 — 비밀 아님)
config:
  authIssuerUri: "https://sso.sb.fisa/application/o/gb-backend/"    # TODO 확인
  memberApiBaseUrl: "http://member.member-dev.svc.cluster.local:8081"  # TODO member 배포 시
  dbHost: "mysql-lb.gb-dev.svc.cluster.local"   # databases-dev → gb-dev
  dbPort: "3306"
  dbName: "community_db"                      # community → community_db
  kafkaBootstrapServers: "kafka.kafka.svc.cluster.local:9092"       # TODO 확인

# Vault에서 가져올 비밀값 경로 (ExternalSecret 참조)
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "community-service/dev"    # Vault 안 경로 (Phase 3에 비밀값 넣을 위치)
