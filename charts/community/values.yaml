# 컨테이너 이미지
image:
  repository: harbor.sb.fisa/global_bridge/community
  tag: "32"
  pullPolicy: IfNotPresent

# Pod 개수
replicaCount: 1

# Harbor 사설 레지스트리 인증 (시크릿은 community-dev NS에 별도 만듦)
imagePullSecrets:
  - name: harbor-dockercfg

# Spring server.port = 8082
service:
  port: 8080          # 기존 8082 → 8080 (nginx.conf 접근 포트)
  containerPort: 8082  # 추가 (실제 앱 포트)
  type: ClusterIP

# 런타임 SA — 기본 off. stage(values-stage)에서 create:true + EKS Pod Identity로 역할 바인딩.
serviceAccount:
  create: false
  name: community

# 어느 환경에서 도는지 (Dockerfile 기본값 dev를 K8s에서도 dev로)
springProfilesActive: dev

# 평범한 설정값 (ConfigMap으로 주입 — 비밀 아님)
config:
  authIssuerUri: "https://sso.sb.fisa/application/o/gb-backend/"    # TODO 확인
  memberApiBaseUrl: "http://member.member-dev.svc.cluster.local:8081"  # TODO member 배포 시
  dbHost: "mysql-lb.gb-dev.svc.cluster.local"   # databases-dev → gb-dev
  dbPort: "3306"
  dbName: "community_db"                      # community → community_db
  kafkaBootstrapServers: "kafka.kafka.svc.cluster.local:9092"       # TODO 확인
  redisHost: "redis.gb-dev.svc.cluster.local"

# Vault에서 가져올 비밀값 경로 (ExternalSecret 참조)
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "community-service/dev"    # Vault 안 경로 (Phase 3에 비밀값 넣을 위치)

# 리소스 요청/제한 — HPA(CPU 사용률 기준)가 동작하려면 requests.cpu 가 필요
resources:
  # m7g.xlarge(4vCPU/16Gi) 표준 JVM 서비스 — 메모리 request=limit(Guaranteed)
  requests:
    cpu: 500m
    memory: 640Mi
  limits:
    cpu: 1000m
    memory: 640Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제
  # ── HPA 스케일링 동작(behavior) — 기동/GC 일시 CPU 스파이크 과민반응 방지 (2026-06-16) ──
  # scaleUp: 180s 안정화 창 → 지속 부하만 증설(순간 스파이크 무시), 1분당 최대 +2 pod 또는 +50%
  # scaleDown: 300s 안정화 후 천천히 회수 → 크래시루프發 max 폭주(document 사례) 차단
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Max

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # DoNotSchedule: 균등 분산 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설 (2026-06-16 CA 도입으로 채택).
  # matchLabelKeys=pod-template-hash 라 롤아웃·scale-up 시 같은 리비전끼리만 분산을 계산해 새 파드가 막히지 않습니다.
  # ScheduleAnyway: best-effort 분산 (Pending 없음) — CA 없던 시절 기본값.
  whenUnsatisfiable: DoNotSchedule
