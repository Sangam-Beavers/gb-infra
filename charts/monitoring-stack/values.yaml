# monitoring-stack — kube-prometheus-stack 서브차트 설정.
# 서브차트 값은 차트 이름 키(kube-prometheus-stack) 아래에 둔다.

# ── CloudWatch Exporter (YACE) ──────────────────────────────────────
# Aurora(AWS/RDS) + ElastiCache(AWS/ElastiCache) CloudWatch 지표를 Prometheus로.
# 인증은 IAM(아래 serviceAccount.roleArn=IRSA, 또는 비우고 Pod Identity).
cloudwatchExporter:
  enabled: true
  # 2026-06 기준. 업데이트 시 github.com/nerdswords/yet-another-cloudwatch-exporter 릴리스 확인.
  image: ghcr.io/nerdswords/yet-another-cloudwatch-exporter:v0.61.2
  region: ap-northeast-2
  # CloudWatch GetMetricData 비용/해상도 트레이드오프. RDS/ElastiCache 기본 1분 지표 → 300s 권장(요금↓).
  # 더 촘촘히 보려면 60으로 낮추되 API 호출량(=요금) 증가.
  period: 300
  length: 300
  serviceAccount:
    name: cloudwatch-exporter
    # IRSA 사용 시 Terraform이 만든 역할 ARN을 넣는다(values-stage.yaml에서 override 권장).
    # 비워두면 EKS Pod Identity로 바인딩되는 것으로 간주(어노테이션 미주입).
    roleArn: ""

kube-prometheus-stack:

  # ── Grafana (admin 콘솔 임베드가 핵심) ─────────────────────────────
  grafana:
    enabled: true
    grafana.ini:
      security:
        allow_embedding: true          # iframe 임베드 허용 (기본 X-Frame-Options deny 해제)
      auth.anonymous:
        enabled: true                  # 로그인 벽 제거 — 내부 전용이라 익명 허용
        org_role: Viewer               # 읽기 전용
    service:
      type: ClusterIP
    # 내부 ALB 인그레스 (admin 콘솔과 동일 패턴: alb · internal)
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internal
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
        # 어드민 콘솔(monitoring) 인그레스와 동일 — 회사망이 닿는 관리 서브넷 + 인바운드 CIDR 지정.
        # 이게 없으면 기본 서브넷에 ALB가 떠서 사내 브라우저에서 접근 불가(ERR_CONNECTION_TIMED_OUT).
        # ⚠️ 노드 풀은 3-AZ(a/b/c)인데 ALB를 a/c만으로 두면, 2b 노드에 뜬 Grafana 파드가
        #    target-type:ip 에서 "Target.NotInUse (AZ not enabled)" → 타깃 0개 → 임베드 전부 503이 된다.
        #    mgmt 서브넷은 a/b/c 모두 존재하므로 b까지 포함해 ALB를 3-AZ로 맞춘다(파드가 어느 AZ에 떠도 healthy).
        alb.ingress.kubernetes.io/subnets: sb-stage-mgmt-a,sb-stage-mgmt-b,sb-stage-mgmt-c
        alb.ingress.kubernetes.io/inbound-cidrs: 10.10.0.0/24,10.10.1.0/24
        alb.ingress.kubernetes.io/healthcheck-path: /
      hosts: []                        # 호스트리스 — 생성된 내부 ELB 주소로 접근
      path: /
    # 대시보드 ConfigMap 자동 import (label=grafana_dashboard 붙은 CM을 사이드카가 로드)
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
        provider:
          allowUiUpdates: true
    # 커뮤니티 검증 대시보드를 gnetId로 자동 import (A안).
    # k8s 대시보드는 kube-prometheus-stack 기본 포함(defaultDashboardsEnabled).
    # ⚠ 배포 후 Grafana에서 각 대시보드 실제 UID를 확인해 admin-service 임베드 URL에 반영(Track B).
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: gb-default
            orgId: 1
            folder: GB
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/gb-default
    # ⚠️ JVM·Spring Boot APM 임베드 대시보드는 gnet 자동 import를 쓰지 않는다.
    # gnet import는 (재)배포마다 UID가 바뀌어 admin-service 임베드 URL(고정 UID)과 어긋나 "Not found"가 난다.
    # → RDS/ElastiCache와 동일하게 dashboards/*.json 으로 UID를 고정해 사이드카(grafana_dashboard ConfigMap)가 로드:
    #     JVM         = dashboards/gb-jvm-micrometer.json (uid 751f8ea6-...)
    #     Spring Boot = dashboards/gb-springboot-apm.json  (uid X09JGT7Gz)
    #   UID가 admin yaml 임베드 경로와 같아 admin-service 무변경. (이전 jvm-micrometer/spring-boot-statistics gnet 항목 제거)
    # Redis는 임베드 대상이 아니라 UID 드리프트가 무관하므로 gnet 자동 import 유지.
    dashboards:
      gb-default:
        redis:
          gnetId: 763           # Redis Dashboard for Prometheus Redis Exporter
          revision: 6
          datasource: Prometheus

  # ── Prometheus ────────────────────────────────────────────────────
  prometheus:
    prometheusSpec:
      retention: 7d
      # 다른 NS(sb-stage-app-ns)의 ServiceMonitor도 픽업하도록 셀렉터 개방
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      ruleNamespaceSelector: {}
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi

  # ── Alertmanager: 1차엔 비활성 (필요 시 켬) ─────────────────────────
  alertmanager:
    enabled: false
