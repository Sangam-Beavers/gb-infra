# redis_exporter용 시크릿 — 기존 sb/stage/redis/auth 재사용(신규 시크릿 없음).
# ESO ClusterSecretStore(aws-secrets-manager)는 클러스터 스코프라 monitoring NS에서도 참조 가능.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-exporter-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: redis-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: REDIS_HOST
      remoteRef:
        key: sb/stage/redis/auth
        property: primary_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: sb/stage/redis/auth
        property: port
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: sb/stage/redis/auth
        property: auth_token
