{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-admin-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: app-admin-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/app-admin/db) ──────────────────
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
    # ── AWS Parameter Store: Auth issuer (member 경로 공용) ───────────────
    - secretKey: AUTH_ISSUER_URI
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psAuthIssuerUri }}  # /sb/stage/member/AUTH_ISSUER_URI 공용
{{- end }}
