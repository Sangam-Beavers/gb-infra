# ── dev(온프렘/Vault) 기본값 ─────────────────────────────────────────
# stage 배포는 values-stage.yaml 이 override 한다(secretBackend: aws).
# app-admin은 Redis/Kafka/번역Lambda 미사용 — 관련 항목 없음.

# 컨테이너 이미지
image:
  repository: harbor.sb.fisa/global_bridge/app-admin
  tag: "1"
  pullPolicy: IfNotPresent

# Pod 개수
replicaCount: 1

# Harbor 사설 레지스트리 인증
imagePullSecrets:
  - name: harbor-dockercfg

# Spring server.port = 8086 (service.port = containerPort, 정석)
service:
  port: 8086
  containerPort: 8086
  type: ClusterIP

# 어느 환경에서 도는지 (Dockerfile 기본값 dev를 K8s에서도 dev로)
springProfilesActive: dev

# dev는 Vault 백엔드
secretBackend: vault

# 평범한 설정값 (ConfigMap으로 주입 — 비밀 아님)
config:
  authIssuerUri: "https://sso.sb.fisa/application/o/gb-backend/"          # TODO 확인
  memberInternalUrl: "http://member.member-dev.svc.cluster.local:8081"    # TODO member 배포 시
  communityInternalUrl: "http://community.community-dev.svc.cluster.local:8080"  # TODO community 배포 시
  dbHost: "mysql-lb.gb-dev.svc.cluster.local"
  dbPort: "3306"
  dbName: "admin_db"
  ddlAuto: "update"

# Vault에서 가져올 비밀값 경로 (ExternalSecret 참조)
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "app-admin-service/dev"   # Vault 안 경로 (Phase 3에 비밀값 넣을 위치)

# 리소스 요청/제한 — HPA(CPU 사용률 기준)가 동작하려면 requests.cpu 가 필요
resources:
  # m7g.large(2vCPU/8Gi) 표준 JVM 서비스 — 메모리 request=limit(Guaranteed)
  requests:
    cpu: 150m
    memory: 640Mi
  limits:
    cpu: 750m
    memory: 640Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # DoNotSchedule: 균등 분산 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설 (2026-06-16 CA 도입으로 채택).
  # matchLabelKeys=pod-template-hash 라 롤아웃·scale-up 시 같은 리비전끼리만 분산을 계산해 새 파드가 막히지 않습니다.
  # ScheduleAnyway: best-effort 분산 (Pending 없음) — CA 없던 시절 기본값.
  whenUnsatisfiable: DoNotSchedule
