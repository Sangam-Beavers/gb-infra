{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: document-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  # 기본 store = Secrets Manager. PS 항목은 각 항목의 sourceRef로 따로 지정.
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: document-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/document/db) ───────────────────
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
    # ── AWS Parameter Store: Cognito issuer (member 경로 공용) ────────────
    # 모든 서비스가 같은 Cognito User Pool issuer를 쓰므로 member 파라미터를 공유.
    # 서비스별로 분리하려면 values-stage.yaml의 psAuthIssuerUri를
    #   /sb/stage/document/AUTH_ISSUER_URI 로 바꾸고 Terraform에 동일 값을 등록.
    - secretKey: AUTH_ISSUER_URI
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psAuthIssuerUri }}
    # ── AWS Parameter Store: Kafka 브로커 주소 (공용 경로) ─────────────────
    # document는 마일스톤 이벤트 Producer. base application.yaml의
    #   spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # 가 이 값을 픽업한다. 미주입 시 localhost로 폴백 → 발행만 실패(앱은 기동).
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psKafkaBootstrapServers }}
{{- end }}
