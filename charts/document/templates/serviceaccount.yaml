{{- if and .Values.serviceAccount.create .Values.serviceAccount.roleArn }}
# document Pod 런타임용 IRSA ServiceAccount.
# roleArn 어노테이션이 있어야 EKS pod-identity webhook이 AWS_WEB_IDENTITY_TOKEN_FILE/AWS_ROLE_ARN을
# 주입 → 앱의 DefaultCredentialsProvider가 SQS/S3/Lambda 호출 자격증명을 얻는다.
# ESO SA(external-secrets:external-secrets)와 별개 — 권한 분리.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
