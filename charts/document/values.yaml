# 컨테이너 이미지
image:
  repository: harbor.sb.fisa/global_bridge/document
  tag: "4"
  pullPolicy: IfNotPresent
# Pod 개수
replicaCount: 1
# Harbor 사설 레지스트리 인증
imagePullSecrets:
  - name: harbor-dockercfg
# Spring server.port = 8083
service:
  port: 8083
  containerPort: 8083
  type: ClusterIP
# 어느 환경에서 도는지
springProfilesActive: dev
# 비밀 백엔드: dev=vault(externalsecret.yaml), stage=aws(externalsecret-aws.yaml, values-stage.yaml에서 override)
secretBackend: vault
# 런타임 IRSA(SQS/S3/Lambda 호출용). dev는 로컬 AWS_PROFILE을 쓰므로 SA 불필요 → 미생성.
serviceAccount:
  create: false
  name: ""
# 평범한 설정값 (ConfigMap으로 주입)
config:
  authIssuerUri: "https://sso.sb.fisa/application/o/gb-backend/"
  memberApiBaseUrl: "http://member.gb-dev.svc.cluster.local:8081"  # TODO member 배포 후 확인
  dbHost: "mysql-lb.gb-dev.svc.cluster.local"
  dbPort: "3306"
  dbName: "document_db"
# Vault에서 가져올 비밀값 경로
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "document-service/dev"

# 리소스 요청/제한 — HPA(CPU 사용률 기준)가 동작하려면 requests.cpu 가 필요
resources:
  # m7g.large(2vCPU/8Gi) 표준 JVM 서비스 — 메모리 request=limit(Guaranteed)
  requests:
    cpu: 150m
    memory: 640Mi
  limits:
    cpu: 750m
    memory: 640Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # ScheduleAnyway: 노드가 부족해도 Pending 없이 best-effort 분산 (HPA/오토스케일 환경 권장)
  # DoNotSchedule: 균등 분산을 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설을 유도
  whenUnsatisfiable: ScheduleAnyway
