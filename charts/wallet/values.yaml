# 컨테이너 이미지
image:
  repository: harbor.sb.fisa/global_bridge/wallet
  tag: "10"
  pullPolicy: IfNotPresent
# Pod 개수
replicaCount: 2
# Harbor 사설 레지스트리 인증
imagePullSecrets:
  - name: harbor-dockercfg
# Spring server.port = 8084
service:
  port: 8084
  containerPort: 8084
  type: ClusterIP
# 비밀 백엔드 — dev=vault, stage=aws (values-stage.yaml에서 override)
secretBackend: vault
# 어느 환경에서 도는지
springProfilesActive: dev
# 평범한 설정값 (ConfigMap으로 주입)
config:
  authIssuerUri: "https://sso.sb.fisa/application/o/gb-backend/"
  memberApiBaseUrl: "http://member.gb-dev.svc.cluster.local:8081"  # TODO member 배포 후 확인
  dbHost: "mysql-lb.gb-dev.svc.cluster.local"
  dbPort: "3306"
  dbName: "wallet_db"
  redisHost: "redis.gb-dev.svc.cluster.local"
  bankApiBaseUrl: "https://banks.aoimiu.com/"
  kafkaBootstrapServers: "gb-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092"
  ddlAuto: "update"
# 컨테이너 리소스 (requests/limits) — env별 override 가능
resources:
  # m7g.large(2vCPU/8Gi, ARM64) 코어 JVM 서비스 — 메모리 request=limit(Guaranteed)로 노드 OOM 방지, CPU만 burst
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: 1000m      # 노드 2코어 중 최대 1코어까지 burst
    memory: 1Gi
# Vault에서 가져올 비밀값 경로 (dev)
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "wallet-service/dev"

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # DoNotSchedule: 균등 분산 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설 (2026-06-16 CA 도입으로 채택).
  # matchLabelKeys=pod-template-hash 라 롤아웃·scale-up 시 같은 리비전끼리만 분산을 계산해 새 파드가 막히지 않습니다.
  # ScheduleAnyway: best-effort 분산 (Pending 없음) — CA 없던 시절 기본값.
  whenUnsatisfiable: DoNotSchedule
