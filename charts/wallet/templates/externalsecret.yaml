apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wallet-secrets
  labels:
    app: wallet
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  # 기본 store(항목에 storeName override 없을 때 적용). dev=vault-backend, stage=aws-secrets-manager
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: wallet-secrets
    creationPolicy: Owner
  data:
  {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      {{- if .storeName }}
      # 항목별 store override(stage Parameter Store 파라미터에 사용)
      sourceRef:
        storeRef:
          name: {{ .storeName }}
          kind: {{ .storeKind | default "ClusterSecretStore" }}
      {{- end }}
      remoteRef:
        key: {{ .key }}
        {{- if .property }}
        property: {{ .property }}
        {{- end }}
  {{- end }}
