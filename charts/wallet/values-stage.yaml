# stage 오버레이 — 적용:  helm ... -f values.yaml -f values-stage.yaml  (ArgoCD valueFiles 동일)
# 비밀=AWS Secrets Manager, 인프라 참조값=Parameter Store. 실제 "값"은 여기 적지 않는다(키 경로만).
env: stage
namespace: sb-stage-app-ns
secretBackend: aws
springProfilesActive: stage

image:
  repository: harbor.sb.fisa/global_bridge/wallet
  tag: "28"
  pullPolicy: IfNotPresent

replicaCount: 2

imagePullSecrets:
  - name: harbor-dockercfg

service:
  type: ClusterIP
  port: 8084
  containerPort: 8084

config:
  # ⚠ stage 검증 한정 (자동 스키마 생성). prod는 validate + 마이그레이션 (Flyway/Liquibase) 으로 전환할 것.
  ddlAuto: "update"
  # authIssuerUri/dbHost/redisHost/kafkaBootstrapServers 없음 → ConfigMap 생략, SM/PS(ExternalSecret)에서 주입
  memberApiBaseUrl: "http://member.sb-stage-app-ns.svc.cluster.local:8081"
  bankApiBaseUrl: "https://banks.aoimiu.com/"
  appAdminApiBaseUrl: "http://app-admin.sb-stage-app-ns.svc.cluster.local:8086"  # wallet → app-admin 수수료 정책 조회 (EXCHANGE/CASHOUT)

externalSecret:
  refreshInterval: 1h
  smDbPath: sb/stage/wallet/db
  smRedisPath: sb/stage/redis/auth
  psPrefix: /sb/stage/member          # Cognito issuer 공유 경로 (Cognito는 공유라 member 경로에 저장됨)
  psKafkaBootstrapServers: /sb/stage/kafka/bootstrap_servers
