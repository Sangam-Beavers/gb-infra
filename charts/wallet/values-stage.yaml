# stage 오버레이 — 적용:  helm ... -f values.yaml -f values-stage.yaml  (ArgoCD valueFiles 동일)
# 비밀=AWS Secrets Manager, 인프라 참조값=Parameter Store. 실제 "값"은 여기 절대 적지 않는다(키 경로만).
springProfilesActive: stage

image:
  repository: harbor.sb.fisa/global_bridge/wallet
  tag: "10"
  pullPolicy: IfNotPresent

# stage 가용성: 베이스(1) override
replicaCount: 2

config:
  # ── 정적 비밀 아님 값(ConfigMap) ──
  # authIssuerUri / dbHost 는 일부러 비움:
  #   - authIssuerUri 없음 → ConfigMap이 issuer를 안 넣고, AUTH_ISSUER_URI를 Parameter Store에서 받음
  #   - dbHost 없음 → ConfigMap이 SPRING_DATASOURCE_URL을 안 넣고, app이 SM의 DB_HOST/PORT/NAME으로 URL 조립
  #   - redisHost 없음 → ConfigMap이 redis host/port를 안 넣고, REDIS_HOST/REDIS_PORT를 Secrets Manager에서 받음
  #   - kafkaBootstrapServers 없음 → ConfigMap이 안 넣고, KAFKA_BOOTSTRAP_SERVERS를 Parameter Store에서 받음
  memberApiBaseUrl: "http://member.sb-stage-app-ns.svc.cluster.local:8081"
  bankApiBaseUrl: "https://banks.aoimiu.com/"
