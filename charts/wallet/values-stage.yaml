externalSecret:
  refreshInterval: 1h
  # 기본 store = Secrets Manager. Parameter Store 항목만 storeName으로 개별 override.
  storeName: aws-secrets-manager
  storeKind: ClusterSecretStore
  data:
    # ── Aurora DB 자격증명: Secrets Manager / sb/stage/wallet/db (JSON property 이름은 실제 시크릿과 일치해야 함) ──
    - { secretKey: DB_HOST,                    key: "sb/stage/wallet/db", property: host }
    - { secretKey: DB_PORT,                    key: "sb/stage/wallet/db", property: port }
    - { secretKey: DB_NAME,                    key: "sb/stage/wallet/db", property: dbname }
    - { secretKey: SPRING_DATASOURCE_USERNAME, key: "sb/stage/wallet/db", property: username }
    - { secretKey: SPRING_DATASOURCE_PASSWORD, key: "sb/stage/wallet/db", property: password }
    # ── Valkey 접속정보 + AUTH: Secrets Manager / sb/stage/redis/auth (property는 실제 시크릿 키와 일치해야 함) ──
    - { secretKey: REDIS_HOST,                 key: "sb/stage/redis/auth", property: primary_host }
    - { secretKey: REDIS_PORT,                 key: "sb/stage/redis/auth", property: port }
    - { secretKey: SPRING_DATA_REDIS_PASSWORD, key: "sb/stage/redis/auth", property: auth_token }
    # 읽기 replica 분산 도입 시에만 추가: { secretKey: REDIS_READER_HOST, key: "sb/stage/redis/auth", property: reader_host }
    # ── Cognito 인프라 참조값: Parameter Store(항목별 store override). Cognito는 공유라 member 경로에 저장됨 ──
    - { secretKey: AUTH_ISSUER_URI,       key: "/sb/stage/member/AUTH_ISSUER_URI",       storeName: aws-parameter-store }
    - { secretKey: COGNITO_REGION,        key: "/sb/stage/member/COGNITO_REGION",        storeName: aws-parameter-store }
    - { secretKey: COGNITO_USER_POOL_ID,  key: "/sb/stage/member/COGNITO_USER_POOL_ID",  storeName: aws-parameter-store }
    # ── Kafka 브로커: Parameter Store(공유 kafka 경로) ──
    - { secretKey: KAFKA_BOOTSTRAP_SERVERS, key: "/sb/stage/kafka/bootstrap_servers", storeName: aws-parameter-store }
