{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-community-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mcp-community-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: community DB (sb/stage/community/db) 재사용 ──
    # community-service와 동일한 시크릿을 빌려 쓴다(신규 시크릿/PS 없음).
    # ESO가 SM property를 Python(mysql-connector) 환경변수명으로 리매핑한다.
    # server.py: COMMUNITY_DB_HOST/PORT/USER/PASSWORD/NAME
    - secretKey: COMMUNITY_DB_USER
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: COMMUNITY_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: COMMUNITY_DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: COMMUNITY_DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: COMMUNITY_DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
{{- end }}
