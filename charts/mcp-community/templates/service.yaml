apiVersion: v1
kind: Service
metadata:
  name: mcp-community
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-community
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: mcp-community
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
