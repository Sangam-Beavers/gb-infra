# mcp-community (MCP2) 기본값 — dev 기준. stage는 values-stage.yaml이 override.
# (mcp-updater 차트와 동일한 미니멀 구조: _helpers/configmap 없음, 시크릿은 ExternalSecret 재사용)
image:
  repository: harbor.sb.fisa/global_bridge/mcp-community
  tag: "1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-dockercfg

replicaCount: 1

# FastMCP Streamable HTTP 기본 포트 8000
service:
  type: ClusterIP
  port: 8000
  containerPort: 8000

# 비밀 백엔드 — dev=vault, stage=aws (values-stage.yaml에서 override)
# ⚠ dev(vault)에서는 externalsecret-aws가 렌더되지 않는다. mcp-updater와 동일하게
#   dev는 로컬 .env로 구동하는 전제이며, 클러스터 배포는 stage를 1차 타깃으로 한다.
secretBackend: vault

namespace: sb-dev-app-ns

# DB 시크릿은 community-service의 것을 재사용한다(별도 시크릿/PS 신설 없음).
externalSecret:
  refreshInterval: 1h
  smDbPath: sb/stage/community/db

resources:
  # FastMCP(Python) 서버 — 경량, 메모리 request=limit(Guaranteed)
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 300m
    memory: 256Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # ScheduleAnyway: 노드가 부족해도 Pending 없이 best-effort 분산 (HPA/오토스케일 환경 권장)
  # DoNotSchedule: 균등 분산을 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설을 유도
  whenUnsatisfiable: ScheduleAnyway
