# admin-service 기본값 — dev 기준. stage는 values-stage.yaml이 override.
image:
  repository: harbor.sb.fisa/global_bridge/admin
  tag: "1"
  pullPolicy: IfNotPresent

replicaCount: 1

imagePullSecrets:
  - name: harbor-dockercfg

# Spring server.port = 8085
service:
  type: ClusterIP
  port: 8085
  containerPort: 8085

# 어느 환경에서 도는지
springProfilesActive: dev

# 비밀 백엔드 — dev=vault(externalsecret.yaml), stage=aws(externalsecret-aws.yaml)
secretBackend: vault

namespace: sb-dev-app-ns

# 비밀 아닌 설정(ConfigMap admin-config로 주입) — 다른 서비스 호출 URL + 임베드 base URL
config:
  memberHealthUrl: "http://member.gb-dev.svc.cluster.local:8081"
  communityHealthUrl: "http://community.gb-dev.svc.cluster.local:8082"
  documentHealthUrl: "http://document.gb-dev.svc.cluster.local:8083"
  walletHealthUrl: "http://wallet.gb-dev.svc.cluster.local:8084"
  memberInternalUrl: "http://member.gb-dev.svc.cluster.local:8081"
  communityInternalUrl: "http://community.gb-dev.svc.cluster.local:8082"
  documentInternalUrl: "http://document.gb-dev.svc.cluster.local:8083"
  walletInternalUrl: "http://wallet.gb-dev.svc.cluster.local:8084"
  grafanaBaseUrl: "http://localhost:3000"   # TODO dev Grafana 주소
  argocdBaseUrl: "http://localhost:8080"    # TODO dev ArgoCD 주소

# Vault에서 가져올 비밀값 경로 (dev — db_password만)
externalSecret:
  refreshInterval: 1h
  storeName: vault-backend
  storeKind: ClusterSecretStore
  vaultPath: "admin-service/dev"

resources:
  # m7g.xlarge(4vCPU/16Gi) 표준 JVM 서비스 — 메모리 request=limit(Guaranteed)
  requests:
    cpu: 500m
    memory: 640Mi
  limits:
    cpu: 1000m
    memory: 640Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제
  # ── HPA 스케일링 동작(behavior) — 기동/GC 일시 CPU 스파이크 과민반응 방지 (2026-06-16) ──
  # scaleUp: 180s 안정화 창 → 지속 부하만 증설(순간 스파이크 무시), 1분당 최대 +2 pod 또는 +50%
  # scaleDown: 300s 안정화 후 천천히 회수 → 크래시루프發 max 폭주(document 사례) 차단
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 25
          periodSeconds: 120
      selectPolicy: Max

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # DoNotSchedule: 균등 분산 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설 (2026-06-16 CA 도입으로 채택).
  # matchLabelKeys=pod-template-hash 라 롤아웃·scale-up 시 같은 리비전끼리만 분산을 계산해 새 파드가 막히지 않습니다.
  # ScheduleAnyway: best-effort 분산 (Pending 없음) — CA 없던 시절 기본값.
  whenUnsatisfiable: DoNotSchedule
