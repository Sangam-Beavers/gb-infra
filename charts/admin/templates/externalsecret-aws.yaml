{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: admin-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/admin/db) ──────────────────────
    # admin 전용 스키마(svc_admin)/유저(admin_svc). 다른 서비스 DB 시크릿과 분리.
    # application-stage.yml: url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME},
    #   username=${SPRING_DATASOURCE_USERNAME}, password=${SPRING_DATASOURCE_PASSWORD}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
    # ── AWS Parameter Store: Auth issuer (member 경로 공용) ───────────────
    # stage는 Cognito 검표원 + admin 그룹 인가를 켠다(application-stage.yml: issuer-uri=${AUTH_ISSUER_URI}).
    # member/app-admin과 동일한 공용 Cognito issuer 파라미터를 그대로 읽는다(별도 SSM 불필요).
    - secretKey: AUTH_ISSUER_URI
      sourceRef:
        storeRef:
          name: aws-parameter-store
          kind: ClusterSecretStore
      remoteRef:
        key: {{ .Values.externalSecret.psAuthIssuerUri }}  # /sb/stage/member/AUTH_ISSUER_URI 공용
{{- end }}
