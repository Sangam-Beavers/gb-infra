{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: admin-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: DB (sb/stage/admin/db) ──────────────────────
    # admin 전용 스키마(svc_admin)/유저(admin_svc). 다른 서비스 DB 시크릿과 분리.
    # application-stage.yml: url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME},
    #   username=${SPRING_DATASOURCE_USERNAME}, password=${SPRING_DATASOURCE_PASSWORD}
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: username
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: {{ .Values.externalSecret.smDbPath }}
        property: dbname
{{- end }}
