{{- if eq .Values.secretBackend "vault" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: admin-secrets
  labels:
    app: admin
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.storeName }}
    kind: {{ .Values.externalSecret.storeKind }}
  target:
    name: admin-secrets
    creationPolicy: Owner
  data:
    # dev는 application-dev.yml이 host/username을 하드코딩하고 비밀번호만 env(ADMIN_DB_PASSWORD)로 받는다.
    - secretKey: ADMIN_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: db_password
{{- end }}
