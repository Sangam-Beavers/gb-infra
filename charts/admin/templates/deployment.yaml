apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  labels:
    app: admin
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app: admin
      {{- end }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: admin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.springProfilesActive | quote }}
          envFrom:
            # admin-config: 비밀 아닌 설정(다른 서비스 URL, Grafana/ArgoCD base URL)
            - configMapRef:
                name: admin-config
            # admin-secrets: DB 접속정보 (dev=vault / stage=aws ExternalSecret)
            - secretRef:
                name: admin-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          # NOTE(2026-06-16): liveness는 의존성(DB/Kafka/SQS) 제외한 Spring liveness 그룹 사용
          #   → 의존성 블립으로 컨테이너가 죽는 크래시루프 방지(document HPA 폭주 원인과 동일 패턴).
          # ⚠️ 적용 전 확인: 앱이 /actuator/health/liveness 노출하는지
          #   (management.endpoint.health.probes.enabled=true). member/wallet은 이미 사용 중.
          # NOTE(2026-06-17): CPU 포화로 liveness 응답이 늦으면 kubelet이 죽음으로 오판→kill→크래시루프 캐스케이드.
          #   → timeoutSeconds 10·failureThreshold 6 으로 둔감화(kill까지 grace ~180s, 부하테스트 근거).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
