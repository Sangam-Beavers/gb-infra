apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-exchange
  namespace: {{ .Values.namespace }}
  labels:
    app: mcp-exchange
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mcp-exchange
  template:
    metadata:
      labels:
        app: mcp-exchange
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: mcp-exchange
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
          env:
            # FastMCP 내부 uvicorn이 0.0.0.0 바인딩하도록 강제 (기본값 127.0.0.1 → K8s 프로브 접근 불가)
            - name: UVICORN_HOST
              value: "0.0.0.0"
            - name: UVICORN_PORT
              value: "8000"
          envFrom:
            - secretRef:
                name: mcp-exchange-secrets
          # FastMCP streamable-http 서버 — TCP 연결로 생존 확인
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
