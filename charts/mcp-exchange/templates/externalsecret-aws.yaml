{{- if eq .Values.secretBackend "aws" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-exchange-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mcp-exchange-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── AWS Secrets Manager: Redis (sb/stage/redis/auth) ─────────────────
    # Python redis 라이브러리 환경변수 규칙 사용 (Spring Data Redis 와 이름이 다름)
    - secretKey: REDIS_HOST
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: primary_host
    - secretKey: REDIS_PORT
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: port
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: auth_token
    # ElastiCache TLS → server.py ssl= 파라미터로 주입 (true/false 문자열)
    - secretKey: REDIS_SSL_ENABLED
      remoteRef:
        key: {{ .Values.externalSecret.smRedisPath }}
        property: tls
{{- end }}
