# 컨테이너 이미지 (정적 SPA를 담은 nginx — Jenkins가 빌드해 Harbor로 푸시)
image:
  repository: harbor.sb.fisa/global_bridge/monitoring
  tag: "1"
  pullPolicy: IfNotPresent

# Harbor 사설 레지스트리 인증 (앱 ns에 harbor-dockercfg 존재 — install-k8s-stack/ESO가 구비)
imagePullSecrets:
  - name: harbor-dockercfg

replicaCount: 1

# nginx 정적 서빙 포트
containerPort: 80

service:
  type: ClusterIP
  port: 80

# dev(온프렘): cilium ingress + 로컬 CA TLS (front-app과 동일 기조).
# stage(AWS)는 values-stage.yaml에서 VPN 전용 내부 ALB로 override한다.
ingress:
  enabled: true
  className: cilium
  host: monitoring.dev.fisa
  annotations:
    cert-manager.io/cluster-issuer: "sb-local-ca-issuer"
  tls:
    enabled: true
    secretName: monitoring-tls

# docker-entrypoint.sh 가 envsubst 로 nginx.conf 템플릿에 주입하는 런타임 환경변수.
# ADMIN_API_URL: nginx 내부에서 /api/ 요청을 proxy_pass 할 admin-service 주소.
#   dev(온프렘):  http://localhost:8085  (Vite proxy 개발기이므로 Docker 실행 시에만 의미)
#   stage(AWS):  values-stage.yaml에서 K8s ClusterDNS로 override
env:
  ADMIN_API_URL: "http://localhost:8085"

resources:
  # 정적/nginx 서비스 — 경량, 메모리 request=limit(Guaranteed)
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 128Mi

# ── 리비전 / 오토스케일링 (전 차트 공통) ───────────────────────────
# Deployment 리비전(ReplicaSet) 보관 개수 — 롤백 이력 3개까지만 유지
revisionHistoryLimit: 3

# HPA 오토스케일링 — 최소 3 Pod, 부하 시 최대 9 Pod까지 자동 확장
# CPU 평균 사용률 기준이라 컨테이너에 resources.requests.cpu 가 반드시 있어야 동작한다.
# (ArgoCD 환경: autoscaling.enabled=true 면 Deployment의 replicas 필드를 비워 HPA가 소유하게 한다)
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 9
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80   # 메모리 기준도 함께 쓰려면 주석 해제

# Pod 분산 배치 — 같은 노드에 replica가 몰리지 않게 노드(hostname) 단위로 고르게 스케줄 (HA)
topologySpread:
  enabled: true
  maxSkew: 1
  # ScheduleAnyway: 노드가 부족해도 Pending 없이 best-effort 분산 (HPA/오토스케일 환경 권장)
  # DoNotSchedule: 균등 분산을 강제 — 노드 부족 시 Pending → cluster-autoscaler 가 노드 증설을 유도
  whenUnsatisfiable: ScheduleAnyway
